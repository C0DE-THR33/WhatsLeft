<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --text-faint:oklch(0.68 0.014 250);
    --accent:oklch(0.55 0.13 175);
    --accent-soft:oklch(0.94 0.035 175);
    --accent-soft-text:oklch(0.38 0.09 175);
    --warn-text:oklch(0.45 0.1 60);
    --cat-food:oklch(0.68 0.14 55);
    --cat-transport:oklch(0.62 0.12 240);
    --cat-shopping:oklch(0.6 0.13 300);
    --cat-bills:oklch(0.55 0.13 175);
    --cat-entertainment:oklch(0.64 0.15 350);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
  .content{flex:1;padding:22px 20px 10px;display:flex;flex-direction:column;gap:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;}
  .tile-sm{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</helmet>
<div class="screen">
  <div class="content">

    <span style="font-size:19px;font-weight:800;">Analytics</span>

    <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:14px;font-weight:700;">September 2026</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card" style="align-items:center;">
      <svg width="150" height="150" viewBox="0 0 100 100" style="display:block;margin:0 auto;">
        <g transform="rotate(-90 50 50)">
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--cat-food)" stroke-width="15" stroke-dasharray="83.56 238.76" stroke-dashoffset="0"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--cat-bills)" stroke-width="15" stroke-dasharray="78.79 238.76" stroke-dashoffset="-83.56"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--cat-shopping)" stroke-width="15" stroke-dasharray="42.98 238.76" stroke-dashoffset="-162.35"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--cat-transport)" stroke-width="15" stroke-dasharray="21.49 238.76" stroke-dashoffset="-205.33"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--cat-entertainment)" stroke-width="15" stroke-dasharray="11.94 238.76" stroke-dashoffset="-226.82"/>
        </g>
      </svg>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:16px;">
        <div style="display:flex;align-items:center;gap:9px;"><div class="tile-sm" style="background:var(--cat-food);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 9h14l-1.4 8.4A2 2 0 0 1 15.6 19H8.4a2 2 0 0 1-2-1.6L5 9Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div><span style="font-size:12.5px;flex:1;">Food</span><span style="font-size:12.5px;color:var(--text-muted);">₹4,750</span><span style="font-size:12.5px;font-weight:700;width:34px;text-align:right;">35%</span></div>
        <div style="display:flex;align-items:center;gap:9px;"><div class="tile-sm" style="background:var(--cat-bills);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M7 3.5h10v17l-2-1.3-1.7 1.3-1.8-1.3-1.8 1.3L7 19V3.5Z" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/></svg></div><span style="font-size:12.5px;flex:1;">Bills</span><span style="font-size:12.5px;color:var(--text-muted);">₹4,500</span><span style="font-size:12.5px;font-weight:700;width:34px;text-align:right;">33%</span></div>
        <div style="display:flex;align-items:center;gap:9px;"><div class="tile-sm" style="background:var(--cat-shopping);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6.5 8h11l-1 11.2a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3L6.5 8Z" stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/></svg></div><span style="font-size:12.5px;flex:1;">Shopping</span><span style="font-size:12.5px;color:var(--text-muted);">₹2,400</span><span style="font-size:12.5px;font-weight:700;width:34px;text-align:right;">18%</span></div>
        <div style="display:flex;align-items:center;gap:9px;"><div class="tile-sm" style="background:var(--cat-transport);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="4" y="8" width="16" height="10" rx="2.5" stroke="#fff" stroke-width="2.1"/><circle cx="8" cy="18.4" r="1.1" fill="#fff"/><circle cx="16" cy="18.4" r="1.1" fill="#fff"/></svg></div><span style="font-size:12.5px;flex:1;">Transport</span><span style="font-size:12.5px;color:var(--text-muted);">₹1,200</span><span style="font-size:12.5px;font-weight:700;width:34px;text-align:right;">9%</span></div>
        <div style="display:flex;align-items:center;gap:9px;"><div class="tile-sm" style="background:var(--cat-entertainment);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.6" stroke="#fff" stroke-width="1.9"/><path d="M10.2 9.3v5.4l4.6-2.7-4.6-2.7Z" fill="#fff"/></svg></div><span style="font-size:12.5px;flex:1;">Entertainment</span><span style="font-size:12.5px;color:var(--text-muted);">₹600</span><span style="font-size:12.5px;font-weight:700;width:34px;text-align:right;">5%</span></div>
      </div>
    </div>

    <div class="card">
      <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;">Highest spending category</span>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
        <div class="tile-sm" style="width:26px;height:26px;border-radius:8px;background:var(--cat-food);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 9h14l-1.4 8.4A2 2 0 0 1 15.6 19H8.4a2 2 0 0 1-2-1.6L5 9Z" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/></svg></div>
        <span style="font-size:20px;font-weight:800;">Food</span>
        <span style="font-size:14px;font-weight:700;color:var(--text-muted);">₹4,750</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="var(--warn-text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:12.5px;font-weight:700;color:var(--warn-text);">+18% vs August</span>
      </div>
    </div>

    <div>
      <span style="font-size:13.5px;font-weight:700;">Spending trend</span>
      <div class="card" style="margin-top:10px;">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;height:92px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:72px;border-radius:5px;background:var(--border);"></div><span style="font-size:10.5px;color:var(--text-faint);">Apr</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:80px;border-radius:5px;background:var(--border);"></div><span style="font-size:10.5px;color:var(--text-faint);">May</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:67px;border-radius:5px;background:var(--border);"></div><span style="font-size:10.5px;color:var(--text-faint);">Jun</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:82px;border-radius:5px;background:var(--border);"></div><span style="font-size:10.5px;color:var(--text-faint);">Jul</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:90px;border-radius:5px;background:var(--border);"></div><span style="font-size:10.5px;color:var(--text-faint);">Aug</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:22px;height:64px;border-radius:5px;background:var(--accent);"></div><span style="font-size:10.5px;font-weight:700;">Sep</span></div>
        </div>
      </div>
    </div>

    <div class="card" style="background:var(--accent-soft);border:none;flex-direction:row;align-items:flex-start;gap:12px;display:flex;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:1px;"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4.9 1 1 1.7v.4h5v-.4c.1-.7.4-1.3 1-1.7A6 6 0 0 0 12 3Z" stroke="var(--accent-soft-text)" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span style="font-size:13px;line-height:1.55;color:var(--accent-soft-text);font-weight:600;">Your food spending increased 18% this month compared to last month.</span>
    </div>

  </div>
  <dc-import name="BottomNav" active="Analytics" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
</body>
</html>
