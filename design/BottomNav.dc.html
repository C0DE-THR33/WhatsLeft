<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text-muted:oklch(0.52 0.02 250);
    --accent:oklch(0.55 0.13 175);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;}
  .navbar{display:flex;align-items:stretch;justify-content:space-between;width:390px;height:64px;background:var(--surface);border-top:1px solid var(--border);padding:6px 2px 10px;}
  .navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;}
  .navitem span{font-size:10.5px;letter-spacing:0.1px;}
</style>
</helmet>
<div class="navbar">
  <div class="navitem" style="color:{{homeColor}}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-weight:{{homeWeight}}">Home</span>
  </div>
  <div class="navitem" style="color:{{txColor}}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span style="font-weight:{{txWeight}}">Transactions</span>
  </div>
  <div class="navitem" style="color:{{budgetColor}}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor"/></svg>
    <span style="font-weight:{{budgetWeight}}">Budget</span>
  </div>
  <div class="navitem" style="color:{{analyticsColor}}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M5 19V10M12 19V5M19 19v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span style="font-weight:{{analyticsWeight}}">Analytics</span>
  </div>
  <div class="navitem" style="color:{{moreColor}}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="6" height="6" rx="1.3" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="4" width="6" height="6" rx="1.3" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="14" width="6" height="6" rx="1.3" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="6" height="6" rx="1.3" stroke="currentColor" stroke-width="1.8"/></svg>
    <span style="font-weight:{{moreWeight}}">More</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":null,"default":"Home","tsType":"string"}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'Home';
    const c = (n) => active === n ? 'var(--accent)' : 'var(--text-muted)';
    const w = (n) => active === n ? '700' : '600';
    return {
      homeColor: c('Home'), homeWeight: w('Home'),
      txColor: c('Transactions'), txWeight: w('Transactions'),
      budgetColor: c('Budget'), budgetWeight: w('Budget'),
      analyticsColor: c('Analytics'), analyticsWeight: w('Analytics'),
      moreColor: c('More'), moreWeight: w('More'),
    };
  }
}
</script>
</body>
</html>
