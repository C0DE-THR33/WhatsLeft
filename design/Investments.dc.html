<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --text-faint:oklch(0.72 0.012 250);
    --warn-text:oklch(0.45 0.1 60);
    --warn-soft:oklch(0.95 0.045 65);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
  .content{flex:1;padding:22px 20px 10px;display:flex;flex-direction:column;gap:18px;}
</style>
</helmet>
<div class="screen">
  <div class="content">

    <div style="display:flex;align-items:center;gap:12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:17px;font-weight:800;">Investments</span>
      <span style="font-size:11px;font-weight:700;color:var(--warn-text);background:var(--warn-soft);padding:3px 9px;border-radius:999px;">Soon</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 14px;">
      <div style="width:88px;height:88px;border-radius:24px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path d="M4 18l6-7 4 4 6-9" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:19px;font-weight:800;">See your full net worth</span>
        <p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--text-muted);max-width:280px;">Track mutual funds, stocks, and deposits alongside your spending — pulled automatically via Account Aggregator, or added by hand.</p>
      </div>
      <div style="background:var(--surface);color:var(--text-faint);border:1px solid var(--border);border-radius:14px;padding:15px 32px;font-weight:700;font-size:14.5px;">+ Add investment</div>
    </div>

  </div>
  <dc-import name="BottomNav" active="More" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
</body>
</html>
