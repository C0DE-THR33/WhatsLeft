<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --text-faint:oklch(0.68 0.014 250);
    --accent:oklch(0.55 0.13 175);
    --accent-dark:oklch(0.4 0.12 175);
    --accent-soft:oklch(0.94 0.035 175);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--accent-dark);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
</style>
</helmet>
<div class="screen">
  <div style="flex:1;display:flex;flex-direction:column;padding:44px 28px 32px;">
    <div style="display:flex;align-items:center;gap:9px;">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 20c1.5 1.5 3.2 2.2 5.2 2.2 3 0 4.6-1.4 4.6-3.2 0-4.6-9-2.4-9-7.3 0-2 1.8-3.4 4.6-3.4 2 0 3.6.6 5 1.8" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span style="font-size:19px;font-weight:800;letter-spacing:-0.2px;">SpendWise</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:20px 0;">
      <svg width="220" height="180" viewBox="0 0 220 180" fill="none">
        <rect x="14" y="26" width="192" height="128" rx="20" fill="var(--accent-soft)"/>
        <rect x="40" y="96" width="20" height="38" rx="4" fill="var(--accent)" opacity="0.55"/>
        <rect x="72" y="80" width="20" height="54" rx="4" fill="var(--accent)" opacity="0.72"/>
        <rect x="104" y="60" width="20" height="74" rx="4" fill="var(--accent)"/>
        <rect x="136" y="70" width="20" height="64" rx="4" fill="var(--accent)" opacity="0.85"/>
        <circle cx="168" cy="46" r="15" fill="white" stroke="var(--accent)" stroke-width="2"/>
        <path d="M164 46h8M168 42v8" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div style="text-align:center;display:flex;flex-direction:column;gap:12px;">
        <h1 style="margin:0;font-size:27px;font-weight:800;line-height:1.25;letter-spacing:-0.3px;">Know where your<br/>money goes.</h1>
        <p style="margin:0;font-size:14.5px;line-height:1.55;color:var(--text-muted);max-width:280px;">Link your bank once. SpendWise reads every transaction automatically — no manual entry, no spreadsheets.</p>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px;font-weight:700;font-size:15.5px;text-align:center;">Connect your bank</div>
      <a href="#" style="display:block;text-align:center;font-size:13.5px;font-weight:600;color:var(--text-muted);">Set up manually instead</a>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.6-3 8.4-7 9-4-.6-7-4.4-7-9V6l7-3z" stroke="var(--text-faint)" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span style="font-size:11.5px;color:var(--text-faint);">Secured via RBI-licensed Account Aggregator framework</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
