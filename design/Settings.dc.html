<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --accent:oklch(0.55 0.13 175);
    --success-text:oklch(0.42 0.12 150);
    --success-soft:oklch(0.95 0.04 150);
    --danger-text:oklch(0.5 0.15 25);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
  .content{flex:1;padding:22px 20px 10px;display:flex;flex-direction:column;gap:22px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:6px 16px;}
  .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .section-label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
</style>
</helmet>
<div class="screen">
  <div class="content">

    <div style="display:flex;align-items:center;gap:12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:17px;font-weight:800;">Settings</span>
    </div>

    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;">M</div>
      <div style="display:flex;flex-direction:column;">
        <span style="font-size:15px;font-weight:700;">Mark</span>
        <span style="font-size:12.5px;color:var(--text-muted);">mark@example.com</span>
      </div>
    </div>

    <div>
      <div class="section-label">Linked accounts</div>
      <div class="card">
        <div class="item">
          <div style="width:32px;height:32px;border-radius:9px;background:oklch(0.6 0.14 25);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 8h18L12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 10v7M9 10v7M15 10v7M19 10v7M3.5 20h17" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div style="display:flex;flex-direction:column;flex:1;">
            <span style="font-size:13.5px;font-weight:700;">HDFC Bank ••1234</span>
          </div>
          <span style="font-size:11px;font-weight:700;color:var(--success-text);background:var(--success-soft);padding:3px 9px;border-radius:999px;">Active</span>
        </div>
        <div class="item">
          <div style="width:32px;height:32px;border-radius:9px;background:oklch(0.6 0.13 45);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 8h18L12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 10v7M9 10v7M15 10v7M19 10v7M3.5 20h17" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div style="display:flex;flex-direction:column;flex:1;">
            <span style="font-size:13.5px;font-weight:700;">ICICI Bank ••5678</span>
          </div>
          <span style="font-size:11px;font-weight:700;color:var(--success-text);background:var(--success-soft);padding:3px 9px;border-radius:999px;">Active</span>
        </div>
        <div class="item" style="border-bottom:none;">
          <div style="width:32px;height:32px;border-radius:9px;background:oklch(0.55 0.1 300);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 8h18L12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 10v7M9 10v7M15 10v7M19 10v7M3.5 20h17" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div style="display:flex;flex-direction:column;flex:1;">
            <span style="font-size:13.5px;font-weight:700;">Axis Bank ••9012</span>
          </div>
          <span style="font-size:11px;font-weight:700;color:var(--success-text);background:var(--success-soft);padding:3px 9px;border-radius:999px;">Active</span>
        </div>
      </div>
      <div style="text-align:center;font-size:13px;font-weight:700;color:var(--accent);margin-top:10px;">+ Link another bank</div>
    </div>

    <div>
      <div class="section-label">Consent &amp; privacy</div>
      <div class="card">
        <div class="item"><span style="font-size:13.5px;flex:1;">Manage AA consent</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="item" style="border-bottom:none;"><span style="font-size:13.5px;flex:1;">Data &amp; privacy policy</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>

    <div>
      <div class="section-label">Preferences</div>
      <div class="card">
        <div class="item"><span style="font-size:13.5px;flex:1;">Currency</span><span style="font-size:13px;color:var(--text-muted);font-weight:700;">₹ INR</span></div>
        <div class="item" style="border-bottom:none;">
          <span style="font-size:13.5px;flex:1;">Notifications</span>
          <div style="width:38px;height:22px;border-radius:999px;background:var(--accent);position:relative;"><div style="width:16px;height:16px;border-radius:999px;background:#fff;position:absolute;top:3px;right:3px;"></div></div>
        </div>
      </div>
    </div>

    <span style="text-align:center;font-size:13.5px;font-weight:700;color:var(--danger-text);margin-top:6px;">Log out</span>

  </div>
  <dc-import name="BottomNav" active="More" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
</body>
</html>
