<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --text-faint:oklch(0.72 0.012 250);
    --accent:oklch(0.55 0.13 175);
    --accent-soft:oklch(0.94 0.035 175);
    --accent-soft-text:oklch(0.38 0.09 175);
    --warn-text:oklch(0.45 0.1 60);
    --warn-soft:oklch(0.95 0.045 65);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
  .content{flex:1;padding:22px 20px 10px;display:flex;flex-direction:column;gap:22px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:6px 16px;}
  .item{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--border);}
  .icon-tile{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</helmet>
<div class="screen">
  <div class="content">

    <span style="font-size:19px;font-weight:800;">More</span>

    <div class="card">
      <div class="item">
        <div class="icon-tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 8a2 2 0 0 1 2-2h1l1-2h6l1 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8Z" stroke="var(--accent-soft-text)" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="var(--accent-soft-text)" stroke-width="1.7"/></svg></div>
        <span style="font-size:14.5px;font-weight:700;flex:1;">Bill Scanner</span>
        <span style="font-size:11px;font-weight:700;color:var(--warn-text);background:var(--warn-soft);padding:3px 9px;border-radius:999px;">Soon</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="item">
        <div class="icon-tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 18l6-7 4 4 6-9" stroke="var(--accent-soft-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="var(--accent-soft-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span style="font-size:14.5px;font-weight:700;flex:1;">Investments</span>
        <span style="font-size:11px;font-weight:700;color:var(--warn-text);background:var(--warn-soft);padding:3px 9px;border-radius:999px;">Soon</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="item" style="border-bottom:none;">
        <div class="icon-tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="var(--accent-soft-text)" stroke-width="1.7"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18 6l-1.8 1.8M7.8 16.2 6 18M18 18l-1.8-1.8M7.8 7.8 6 6" stroke="var(--accent-soft-text)" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <span style="font-size:14.5px;font-weight:700;flex:1;">Settings</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

  </div>
  <dc-import name="BottomNav" active="More" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
</body>
</html>
