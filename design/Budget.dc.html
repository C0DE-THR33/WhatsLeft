<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.975 0.006 240);
    --surface:oklch(0.995 0.003 240);
    --border:oklch(0.9 0.008 240);
    --text:oklch(0.24 0.02 250);
    --text-muted:oklch(0.52 0.02 250);
    --accent:oklch(0.55 0.13 175);
    --warn:oklch(0.72 0.15 65);
    --danger:oklch(0.58 0.18 25);
    --danger-text:oklch(0.5 0.15 25);
    --cat-food:oklch(0.68 0.14 55);
    --cat-transport:oklch(0.62 0.12 240);
    --cat-shopping:oklch(0.6 0.13 300);
    --cat-bills:oklch(0.55 0.13 175);
    --cat-entertainment:oklch(0.64 0.15 350);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;}
  .content{flex:1;padding:22px 20px 10px;display:flex;flex-direction:column;gap:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;}
  .cat-row{display:flex;flex-direction:column;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);}
  .bar-bg{height:8px;border-radius:999px;background:var(--border);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;}
  .tile-sm{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</helmet>
<div class="screen">
  <div class="content">

    <span style="font-size:19px;font-weight:800;">Budget</span>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:12.5px;font-weight:600;color:var(--text-muted);">Monthly budget</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16 5l3 3-11 11-4 1Z" stroke="var(--text-muted)" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:26px;font-weight:800;margin-top:6px;">₹20,000</div>
      <span style="font-size:12px;color:var(--text-muted);">₹13,450 spent so far this month</span>
    </div>

    <div>
      <span style="font-size:13.5px;font-weight:700;">By category</span>
      <div class="card" style="padding:4px 16px;margin-top:10px;">

        <div class="cat-row">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="tile-sm" style="background:var(--cat-food);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 9h14l-1.4 8.4A2 2 0 0 1 15.6 19H8.4a2 2 0 0 1-2-1.6L5 9Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9a4 4 0 0 1 8 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <span style="font-size:13.5px;font-weight:700;flex:1;">Food</span>
            <span style="font-size:12.5px;color:var(--text-muted);">₹4,750 / ₹6,000</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:79%;background:var(--warn);"></div></div>
        </div>

        <div class="cat-row">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="tile-sm" style="background:var(--cat-transport);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 16v-4.5a1.5 1.5 0 0 1 .3-.9L7 8h10l1.7 2.6a1.5 1.5 0 0 1 .3.9V16" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><rect x="4" y="13" width="16" height="5" rx="1.5" stroke="#fff" stroke-width="1.8"/><circle cx="8" cy="18.4" r="1.3" fill="#fff"/><circle cx="16" cy="18.4" r="1.3" fill="#fff"/></svg></div>
            <span style="font-size:13.5px;font-weight:700;flex:1;">Transport</span>
            <span style="font-size:12.5px;color:var(--text-muted);">₹1,200 / ₹3,000</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:40%;background:var(--accent);"></div></div>
        </div>

        <div class="cat-row">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="tile-sm" style="background:var(--cat-shopping);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6.5 8h11l-1 11.2a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3L6.5 8Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <span style="font-size:13.5px;font-weight:700;flex:1;">Shopping</span>
            <span style="font-size:12.5px;color:var(--text-muted);">₹2,400 / ₹4,000</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:60%;background:var(--accent);"></div></div>
        </div>

        <div class="cat-row">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="tile-sm" style="background:var(--cat-bills);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M7 3.5h10v17l-2-1.3-1.7 1.3-1.8-1.3-1.8 1.3L7 19V3.5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.3 8h5.4M9.3 11.5h5.4M9.3 15h3.3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div>
            <span style="font-size:13.5px;font-weight:700;flex:1;">Bills</span>
            <span style="font-size:12.5px;font-weight:700;color:var(--danger-text);">₹4,500 / ₹5,000</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:90%;background:var(--danger);"></div></div>
        </div>

        <div class="cat-row" style="border-bottom:none;">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="tile-sm" style="background:var(--cat-entertainment);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.6" stroke="#fff" stroke-width="1.7"/><path d="M10.2 9.3v5.4l4.6-2.7-4.6-2.7Z" fill="#fff"/></svg></div>
            <span style="font-size:13.5px;font-weight:700;flex:1;">Entertainment</span>
            <span style="font-size:12.5px;color:var(--text-muted);">₹600 / ₹2,000</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:30%;background:var(--accent);"></div></div>
        </div>

      </div>
    </div>

    <div style="border:1px dashed var(--border);border-radius:14px;padding:13px;text-align:center;font-size:13.5px;font-weight:700;color:var(--text-muted);">+ Add category budget</div>

    <div style="margin-top:auto;background:var(--accent);color:#fff;border-radius:14px;padding:15px;text-align:center;font-weight:700;font-size:15px;">Save budget</div>

  </div>
  <dc-import name="BottomNav" active="Budget" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
</body>
</html>
